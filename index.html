<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F5F6F2">
  <title>مشاركة الملفات | قَبَسْ</title>
  <link rel="icon" type="image/svg+xml" href="/assets/qabas-monogram-forest.svg">
  <link rel="stylesheet" href="/assets/share.css">
</head>
<body>
  <a class="skip-link" href="#main">انتقل إلى المحتوى</a>
  <header class="site-header">
    <div class="frame header-inner">
      <div class="identity">
        <span class="wordmark">
          <span class="wordmark-mark"><img src="/assets/qabas-monogram-brand.svg" width="32" height="32" alt=""></span>
          <span>قَبَسْ</span>
        </span>
        <span class="service-name">مشاركة الملفات</span>
      </div>
      <a class="dashboard-link" href="https://app.qabas.one/" rel="noreferrer">فتح قبس</a>
    </div>
  </header>

  <main class="frame page" id="main" tabindex="-1">
    <div class="page-intro">
      <h1>فتح رابط المشاركة</h1>
    </div>
    <div class="panel">
      <div class="card-content">
        <div class="state">
          <span class="icon-tile" aria-hidden="true"><span class="icon icon-file"></span></span>
          <h2>استخدم الرابط الذي وصلك</h2>
          <p>افتح رابط المشاركة الكامل الذي أرسله إليك صاحب الملف.</p>
          <a class="button" href="/preview/">معاينة صفحة التنزيل</a>
        </div>
      </div>
      <div class="panel-art" aria-hidden="true">
        <div class="orbit"></div>
        <div class="art-echo"></div>
        <div class="art-sheet">
          <img src="/assets/qabas-monogram-forest.svg" width="32" height="32" alt="">
          <span class="art-sheet-line"></span>
          <span class="art-sheet-line"></span>
        </div>
        <div class="art-stamp"><span class="icon icon-download"></span></div>
      </div>
    </div>

  </main>

  <footer class="site-footer">
    <div class="frame footer-inner">
      <p>للمساعدة، تواصل مع مرسل الرابط.</p>
      <span class="latin" lang="en" dir="ltr">share.qabas.one</span>
    </div>
  </footer>
</body>
</html>
